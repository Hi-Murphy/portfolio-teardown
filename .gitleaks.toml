# gitleaks config: the default rules, plus one path allowlist (Murphy decision, S07 G3, 2026-11-01).
#
# The frozen-surface manifests are pure SHA-256 maps of public files. Some keys are file names containing
# "tokens" (for example src/look/tokens.ts), which trips the generic-api-key rule. Fingerprints in
# .gitleaksignore pin a commit SHA and break when a PR is squash-merged; a path allowlist does not.

[extend]
useDefault = true

[[allowlists]]
description = "frozen-surface SHA-256 hash manifests (public file digests, not secrets)"
paths = ['''^packages/xploder/test/frozen-surface(\.s[0-9]+)?\.manifest\.json$''']
