name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Fixture exclusion
        run: pnpm --filter web exec vitest run test/fixture-exclusion.test.ts

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download and verify gitleaks
        run: |
          set -euo pipefail
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo checksums "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" checksums | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C "$RUNNER_TEMP"
      - name: Scan for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

  seo:
    name: 'seo: meta + og'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://hi-murphy.me
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter web seo:expect
      - run: pnpm seo:probe --out-dir apps/web/out --site-url "$SITE_URL" --expect apps/web/out-seo-expect.json --out .evidence/ci/seo/build-1
      - run: rm -rf apps/web/.next apps/web/out
      - run: pnpm build
      - run: pnpm --filter web seo:expect
      - run: pnpm seo:probe --out-dir apps/web/out --site-url "$SITE_URL" --expect apps/web/out-seo-expect.json --compare .evidence/ci/seo/build-1/og-hashes.json --out .evidence/ci/seo/build-2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: seo
          path: .evidence/ci/seo/
          retention-days: 14
