<section data-site-outline="" tabindex="0" class="flex flex-col gap-6 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent mt-3">
<h2 class="text-xl leading-tight text-fg">An inspector for the invisible half of Android networking.</h2>
<div class="grid gap-5 sm:grid-cols-3">
<div>
<h3 class="font-mono text-xs uppercase tracking-[0.16em] text-muted">Problem</h3>
<p class="mt-2 text-sm leading-relaxed text-fg">WebSocket traffic is the hardest part of an Android app to debug: frames fly past, sessions blend together, and logcat gives you a wall of text with no notion of a session. Existing HTTP inspectors stop at request/response — they do not understand long-lived sockets.</p>
</div>
<div>
<h3 class="font-mono text-xs uppercase tracking-[0.16em] text-muted">Approach</h3>
<p class="mt-2 text-sm leading-relaxed text-fg">Mirror the decorator idea onto Scarlet: a WebSocketFactory wrapper and a WebSocket decorator record each frame into Room, tag it with a session identity resolved by a tracker, and surface the result through a foreground-service notification that opens a Compose UI. The library keeps a four-file public surface so internals stay free to change, and skips DI frameworks entirely — constructor parameters instead.</p>
</div>
<div>
<h3 class="font-mono text-xs uppercase tracking-[0.16em] text-muted">Outcome</h3>
<p class="mt-2 text-sm leading-relaxed text-fg">The sample host runs two Scarlet clients against one endpoint and the inspector captures both into separate sessions, with frames replayable in a list → detail flow from the notification. The app then became the benchmark target for my JEV decision-hook research — fifteen refactor tasks across ten rule areas.</p>
</div>
